name: Publicando o Kung Fu Panda

on:
  push:
    branches: ["main"]
  
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  Validar:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer o gitclone
        uses: actions/checkout@v4
      - name: Visualizar os arquivos
        run: ls -l
  
  Deploy:
    needs: Validar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
